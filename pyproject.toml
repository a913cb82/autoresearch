[project]
name = "autoresearch"
version = "0.1.0"
description = "Evolve code against a score"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autoresearch = "autoresearch.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"
